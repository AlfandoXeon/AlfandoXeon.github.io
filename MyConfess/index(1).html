<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="hii, please buka ini yaa">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Confess from Tyo Alfando</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
</head>

<body>

  <!-- Subtle Background Glow -->
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Main App -->
  <div id="app">
    <!-- Slide Container (Full Screen — rendered by JS) -->
    <div id="slide-container"></div>
  </div>

  <!-- Background Music -->
  <audio id="bg-music" loop preload="auto">
    <source src="MusicRomantis/backsound.mp3" type="audio/mpeg">
  </audio>

  <!-- Rejection Modal -->
  <div class="modal fade" id="rejectionModal" tabindex="-1" aria-labelledby="rejectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rejection-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="rejectionModalLabel">Alasan Penolakan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3" style="font-size: 0.9rem;">
            Gapapa bel, aku mengerti. Tapi boleh tau alasannya?
          </p>
          <textarea class="form-control" id="rejection-reason" rows="3" placeholder="Tulis alasan kamu disini..."
            maxlength="500"></textarea>
          <div class="invalid-feedback">
            Tolong isi alasannya ya bel..
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn-confess btn-whatsapp btn-sm" id="send-rejection">
            Kirim via WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App Logic -->
  <script src="script.js"></script>
</body>

</html>
